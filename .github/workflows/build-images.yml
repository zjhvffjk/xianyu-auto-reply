name: Build & Push Images (Aliyun ACR)

# 构建 4 个应用镜像并推送到阿里云容器镜像服务（ACR）
# 推完后，deploy.sh / deploy_remote.sh / update.sh 即可从自己的仓库拉取镜像
#
# 首次使用前需要配置（GitHub 仓库 → Settings → Secrets and variables → Actions）：
#   ACR_NAMESPACE  你的 ACR 命名空间，例如 zjhvffjk
#   ACR_USERNAME   阿里云账号全名（或 RAM 子账号名）
#   ACR_PASSWORD   ACR「访问凭证」里设置的固定密码（不是阿里云登录密码）

on:
  # 手动触发（首次构建 / 指定平台时用）
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台。默认单平台 linux/amd64；需要 arm64 时填 linux/amd64,linux/arm64'
        required: false
        default: 'linux/amd64'
        type: string

  # 代码变更自动构建
  push:
    branches: [main]
    paths:
      - 'backend-web/**'
      - 'websocket/**'
      - 'scheduler/**'
      - 'frontend/**'
      - 'common/**'
      - 'docker/**'
      - '.github/workflows/build-images.yml'

env:
  # 阿里云 ACR 个人版「实例专属域名」（新版 ACR 格式，与老版公共域名 registry.cn-shanghai.aliyuncs.com 不通用）
  # 来源：容器镜像服务 → 访问凭证 → docker login 命令里的域名
  REGISTRY: crpi-finrm3ou1o025a6k.cn-shanghai.personal.cr.aliyuncs.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xianyu-backend-web
            dockerfile: backend-web/Dockerfile
          - image: xianyu-websocket
            dockerfile: websocket/Dockerfile
          - image: xianyu-scheduler
            dockerfile: scheduler/Dockerfile
          - image: xianyu-frontend
            dockerfile: docker/frontend/Dockerfile

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 QEMU（构建 arm64 需要）
        uses: docker/setup-qemu-action@v3

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
