# Nginx配置 - 闲鱼自动回复系统前端
server {
    listen 80;
    server_name localhost;
    
    # 后端地址走变量 + resolver：nginx 对「不带变量的 hostname」只在启动时解析一次并缓存，
    # 后端容器重建后 IP 会变，缓存的旧 IP 会让所有 /api 直接 502（静态页仍 200，不易察觉）。
    # 用变量后每次请求都会按 valid 时间重新解析，容器重建不再需要重启 frontend。
    # 127.0.0.11 是 Docker 内置 DNS（见容器 /etc/resolv.conf）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend-web:8089";
    
    # 根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;
    
    # 前端静态资源缓存（构建产物hash文件名）
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API代理到后端服务
    location /api {
        client_max_body_size 50m;
        # 变量形式下不会自动拼 URI，用 $request_uri 透传原始路径与查询串
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
    }
    
    # 后端健康检查代理
    location /health {
        proxy_pass http://$backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 后端静态文件代理（上传的图片、群二维码等，覆盖整个 /static）
    location /static {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # SPA路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
